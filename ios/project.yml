# XcodeGen spec — the source of truth for the Xcode project.
# Run `xcodegen` in this folder to (re)generate Starlight.xcodeproj.
name: Starlight
options:
  bundleIdPrefix: com.jeremypress
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6KGFCX8KPU
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Starlight:
    type: application
    platform: iOS
    sources:
      - path: Starlight
      # The built web game (`pnpm build` output), copied into the app as a folder.
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremypress.starlight
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Starlight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
